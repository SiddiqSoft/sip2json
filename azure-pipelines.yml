- task: VSBuild@1
  displayName: 'Build solution Release'
  inputs:
    solution: '**/*.sln'
    vsVersion: 17.0
    platform: x64
    msbuildArgs: ''
    configuration: Release
    maximumCpuCount: true
    msbuildArchitecture: x64
    clean: true
  condition: succeeded()

- task: CmdLine@2
  displayName: Running the googletest validation_tests
  inputs:
    script: |
      echo "Running googletest in Release: `validation_tests.exe --gtest_output=xml`"
      cd output\Release
      echo "The default file will be test_detail.xml and will be located in the same directory as the exe"
      validation_tests.exe --gtest_output=xml
  condition: succeeded()

- task: VSTest@3
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyDirectory: '$(System.DefaultWorkingDirectory)\output\Release'
    testAssemblyVer2: '$(System.DefaultWorkingDirectory)\output\Release\validation_tests.exe --gtest_output=xml'
    searchFolder: '$(System.DefaultWorkingDirectory)\output\Release'
    resultsFolder: '$(System.DefaultWorkingDirectory)\output\Release\test_detail.xml'
    runInParallel: true
    codeCoverageEnabled: true
    platform: 'x64'
    configuration: 'Release'

- task: PublishTestResults@2
  displayName: 'Publish Release Test Results test_detail.xml'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '$(System.DefaultWorkingDirectory)\output\Release\test_detail.xml'
    mergeTestResults: true
    buildPlatform: 'x64'
    buildConfiguration: 'Release'
  continueOnError: true

- task: NuGetCommand@2
  displayName: 'NuGet pack'
  inputs:
    command: 'pack'
    packagesToPack: 'nuget/*.nuspec'
    versioningScheme: 'off'
    buildProperties: 'VERSION=$(build.buildNumber)'
  condition: succeeded()

- task: NuGetCommand@2
  displayName: 'NuGet push'
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;build/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'sqs-nuget'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

- task: GitHubRelease@1
  inputs:
    gitHubConnection: 'github-packages-sqs'
    repositoryName: 'siddiqsoftware/sip2json'
    action: 'create'
    target: '$(Build.SourceVersion)'
    tagSource: 'userSpecifiedTag'
    tag: '$(build.buildNumber)'
    title: 'v$(build.buildNumber)'
    releaseNotesSource: 'inline'
    releaseNotesInline: 'Documentation https://siddiqsoftware.github.io/sip2json'
    isPreRelease: true
    changeLogCompareToRelease: 'lastFullRelease'
    changeLogType: 'commitBased'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
