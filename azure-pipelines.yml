# ============================================================================
# Azure Pipelines Main Configuration
# ============================================================================
#
# This pipeline:
# 1. Builds the library across multiple platforms with a build matrix
#    - Windows (x64, arm64) with MSVC
#    - Linux (x64) with Clang and GCC
# 2. Runs tests on all platforms (configurable)
# 3. Publishes to NuGet, GitHub Releases, and GitHub Pages (on main/master branches)
#
# Pipeline Stages:
# 1. Windows - Cleanup, build, and test for Windows with matrix for architecture and compiler
# 2. Linux - Cleanup, build, and test for Linux with matrix for architecture and compiler
# 3. PublishNuGet - Publishes NuGet package
# 4. PublishGitHub - Creates GitHub release with build artifacts
# 5. PublishDocs - Builds MkDocs site and publishes to GitHub Pages (gh-pages)
# ============================================================================

# ============================================================================
# TRIGGER & PR CONFIGURATION
# ============================================================================
trigger:
  branches:
    include:
      - main
      - master
      - development
      - devel
      - release/*
  paths:
    exclude:
      - README.md
      - .azure/*
      - azure-pipelines.yml # Avoids recursive triggers when modifying the pipeline itself
pr:
  branches:
    include:
      - main
      - release/*

# ============================================================================
# RESOURCES
# ============================================================================
resources:
  repositories:
    - repository: self
      type: git

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: Architectures
    type: stringList
    default: [ arm64 ]
    values: [ arm64, x64 ]
    displayName: "Architectures to build (x64, arm64)"
  
  - name: Platforms
    type: stringList
    default: [ Windows, Linux ]
    values: [ Windows, Linux, Darwin ]
    displayName: "Platforms to build (Windows, Linux)"
  
  # Compiler Selection per Platform
  - name: Compilers_Windows
    type: stringList
    default: [ MSVC ]
    values: [ MSVC ]
    displayName: "Windows compilers to build (MSVC)"

  - name: Compilers_Linux
    type: stringList
    default: [ Clang ]
    values: [ Clang, GCC ]
    displayName: "Linux compilers to build (Clang, GCC)"

  - name: Compilers_Darwin
    type: stringList
    default: [ Clang ]
    values: [ Clang ]
    displayName: "Darwin compilers to build (Clang, GCC)"

  - name: BuildTypes
    type: stringList
    default: [ Release ]
    values: [ Release, Debug ]
    displayName: "Build types to build (Release, Debug)"
  
  # Testing
  - name: RunTests
    type: boolean
    default: true
    displayName: "Run tests after building"

  # Publishing
  - name: PublishNuGet
    type: boolean
    default: false
    displayName: "Publish to NuGet (auto-enabled on main/master)"

  - name: PublishGitHub
    type: boolean
    default: false
    displayName: "Create GitHub release (auto-enabled on main/master)"

  - name: PublishDocs
    type: boolean
    default: false
    displayName: "Publish documentation site (auto-enabled on main/master)"

  # Cleanup
  - name: Cleanup
    type: boolean
    default: false
    displayName: "Cleanup only (skip builds and tests)"

# ============================================================================
# VARIABLES
# ============================================================================
variables:
  # Auto-enable publishing on main/master branches
  ${{ if and(eq(parameters.PublishNuGet, false), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))) }}:
    PublishNuGet: true
    PublishGitHub: true
    PublishDocs: true
  ${{ else }}:
    PublishNuGet: ${{ parameters.PublishNuGet }}
    PublishGitHub: ${{ parameters.PublishGitHub }}
    PublishDocs: ${{ parameters.PublishDocs }}

  # System information
  AgentOS: $(Agent.OS)
  AgentArch: $(Agent.OSArchitecture)

  # Build paths
  cpmCachePath: $(Agent.HomeDirectory)/.cpmcache
  buildOutputPat_h: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)
  testResultsPat_h: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests/results

# ============================================================================
# STAGES
# ============================================================================
stages:
  # ==========================================================================
  # STAGE 1: WINDOWS BUILD
  # ==========================================================================
  - stage: Windows
    displayName: Windows
    condition: ${{ containsValue(parameters.Platforms, 'Windows') }}
    dependsOn: []

    jobs:
    - ${{ if eq(parameters.Cleanup, true) }}:
      - template: .azure/az-cleanup-windows.yml
        parameters:
          displayName: "Windows Cleanup"
          BuildOperatingSystem: $(Agent.OS)
          CleanupDirectory: ${{ variables.cpmCachePath }}

    - template: .azure/az-build-windows.yml
      parameters:
        displayName: "Windows Build and Test"
        architectures: ${{ parameters.Architectures }}
        compilers: ${{ parameters.Compilers_Windows }}
        buildTypes: ${{ parameters.BuildTypes }}
        runTests: ${{ parameters.RunTests }}
        publishNuGet: ${{ variables.PublishNuGet }}

  # ==========================================================================
  # STAGE 1: LINUX BUILD
  # ==========================================================================
  - stage: Linux
    displayName: Linux
    condition: ${{ containsValue(parameters.Platforms, 'Linux') }}
    dependsOn: []

    jobs:
    - ${{ if eq(parameters.Cleanup, true) }}:
      - template: .azure/az-cleanup-linux.yml
        parameters:
          displayName: "Linux Cleanup"
          BuildOperatingSystem: $(Agent.OS)
          CleanupDirectory: ${{ variables.cpmCachePath }}

    - template: .azure/az-build-linux.yml
      parameters:
        displayName: "Linux Build and Test"
        architectures: ${{ parameters.Architectures }}
        compilers: ${{ parameters.Compilers_Linux }}
        buildTypes: ${{ parameters.BuildTypes }}
        runTests: ${{ parameters.RunTests }}

  # ==========================================================================
  # STAGE 3: NUGET PUBLICATION
  # ==========================================================================
  - stage: PublishNuGet
    displayName: "NuGet Release"
    dependsOn:
      - Windows
      - Linux
    condition: and(eq(${{ variables.PublishNuGet }}, true), succeeded())
    jobs:
      - job: ApproveNuGetRelease
        displayName: "Manual Approval - NuGet Release"
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: 'Please review and approve the publication of the NuGet package.'
              onTimeout: 'reject'

      - template: .azure/az-publish-nuget.yml
        parameters:
          displayName: NuGet Release
          PublishNuGet: ${{ variables.PublishNuGet }}
          dependsOn: [ ApproveNuGetRelease ]

  # ==========================================================================
  # STAGE 4: GITHUB RELEASE PUBLICATION
  # ==========================================================================
  - stage: PublishGitHub
    displayName: "GitHub Release"
    dependsOn:
      - Windows
      - Linux
    condition: and(eq(${{ variables.PublishGitHub }}, true), succeeded())
    jobs:
      - job: ApproveGitHubRelease
        displayName: "Manual Approval - GitHub Release"
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: 'Please review and approve the creation of the GitHub Release.'
              onTimeout: 'reject'

      - template: .azure/az-publish-github.yml
        parameters:
          displayName: GitHub Release
          PublishGitHub: ${{ variables.PublishGitHub }}
          dependsOn: [ ApproveGitHubRelease ]

  # ==========================================================================
  # STAGE 5: GITHUB PAGES DOCUMENTATION PUBLICATION
  # ==========================================================================
  - stage: PublishDocs
    displayName: "Publish Documentation Site"
    dependsOn:
      - Windows
      - Linux
    condition: and(eq(${{ variables.PublishDocs }}, true), succeeded())
    jobs:
      - job: ApproveDocsRelease
        displayName: "Manual Approval - Documentation Site"
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: 'Please review and approve publishing the documentation site to GitHub Pages.'
              onTimeout: 'reject'

      - template: .azure/az-publish-docs.yml
        parameters:
          displayName: Publish Documentation Site
          dependsOn: [ ApproveDocsRelease ]
