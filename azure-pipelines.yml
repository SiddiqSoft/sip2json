###############################################
# SiddiqSoft Azure DevOps Pipelines Template  #
# For C++ Projects                            #
# Version 2.0                                 #
###############################################
trigger:
  batch: 'true'
  branches:
    include:
    - master
    - main
    - bufix/*
    - release/*
    - hotfix/*
    - feature/*
  paths:
    exclude:
    - README.md

variables:
  buildConfiguration: 'Release'

stages:
################################## STAGE ####################################
# STAGE: BuildTest                                                          #
#############################################################################
- stage: BuildTest
  displayName: 'Building Multiple OS, Testing and Package for Windows'
  jobs:
  - job: build
    displayName: 'Build and Test'
    workspace:
      clean: all

    strategy:
      matrix:
        Windows:
          osName: Windows_NT
          poolName: Default
          poolImageName:
          cmake.preset: Windows-Release
        Linux:
          osName: Linux
          poolName: Default
          poolImageName:
          cmake.preset: Linux-Release

    pool:
      name: $(poolName)
      vmImage: $(poolImageName)
      demands:
        - Agent.OS -equals $(osName)

    steps:
    - checkout: self
      fetchDepth: 0
      name: step1

    - task: NuGetToolInstaller@1
      displayName: 'Install Nuget'
      inputs:
        versionSpec: '>=6.0.0-0'
        checkLatest: true

    - task: gitversion/setup@3.0.0
      displayName: 'Install GitVersion..'
      inputs:
        versionSpec: '6.x'
        preferLatestVersion: true

    - task: gitversion/execute@3.0.0
      displayName: 'Determine Version..'
      name: version_step
      inputs:
        useConfigFile: true
        configFilePath: 'GitVersion.yml'

    # Set the flags for testing, build here.
    # sip2json_BUILD_TESTS=ON
    # sip2json_BUILD_PACKAGE=OFF
    - task: CMake@1
      displayName: 'CMake Configure $(cmake.preset)'
      inputs:
        cmakeArgs: '--preset $(cmake.preset) -Dsip2json_BUILD_TESTS=ON -Dsip2json_BUILD_PACKAGE=OFF -DCI_BUILDID=$(GitVersion.MajorMinorPatch).$(GitVersion.CommitsSinceVersionSource)'
        workingDirectory: '$(System.DefaultWorkingDirectory)'

    - task: CMake@1
      displayName: 'CMake Build $(cmake.preset)'
      inputs:
        cmakeArgs: '--build --preset $(cmake.preset) -Dsip2json_BUILD_TESTS=ON -Dsip2json_BUILD_PACKAGE=OFF -DCI_BUILDID=$(GitVersion.MajorMinorPatch).$(GitVersion.CommitsSinceVersionSource)'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
      condition: succeeded()

    - task: CMake@1
      displayName: 'CMake Tests $(cmake.preset)'
      inputs:
        cmakeArgs: '-E chdir $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests ctest $(System.DefaultWorkingDirectory)/build/$(cmake.preset) --output-junit $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/test_detail.xml --output-on-failure'
      condition: succeeded()
      continueOnError: false

    # Try for coverage (but only on Linux build machines)
    - task: CMake@1
      displayName: 'CTest Coverage $(cmake.preset) (Linux only)'
      inputs:
        cmakeArgs: '-E chdir $(System.DefaultWorkingDirectory)/build/$(cmake.preset) ctest $(System.DefaultWorkingDirectory)/build/$(cmake.preset) --output-junit $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/test_detail.xml --output-on-failure  -T Test -T Coverage'
      condition: and(succeeded(), startsWith(variables['Agent.OS'], 'Linux'))
      continueOnError: false

    - task: CmdLine@2
      displayName: 'Coverage collection (Linux builds Only)'
      inputs:
        script: |
          echo "Profile data show..functions.."
          llvm-profdata show -all-functions --detailed-summary -counts -ic-targets -output=tests/llvm_prof.log tests/default.profraw
          echo "Profile data merge............"
          llvm-profdata merge -output=tests/merge.out -instr tests/default.profraw
          echo "Profile data show..html......."
          echo "llvm-cov show -format=html --ignore-filename-regex=_deps/ tests/sip2json_tests --instr-profile=tests/merge.out -o tests/results/coverage.info"
          llvm-cov show -format=html  tests/sip2json_tests --instr-profile=tests/merge.out -o tests/results/coverage.info
        workingDirectory: "$(System.DefaultWorkingDirectory)/build/$(cmake.preset)"
      condition: and(succeeded(), startsWith(variables['Agent.OS'], 'Linux'))
 
    - task: PublishTestResults@2
      displayName: 'Publish $(buildConfiguration) Test Results test_detail.xml'
      inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '$(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/test_detail.xml'
          mergeTestResults: true
          buildConfiguration: '$(buildConfiguration)'
      continueOnError: false
      condition: succeeded()

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Coverage Results (Linux builds)'
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/coverage.*'
      condition: and(succeeded(), startsWith(variables['Agent.OS'], 'Linux'))

################################## STAGE ####################################
# STAGE: Pack_n_Publish                                                     #
#############################################################################
- stage: Pack_n_Publish
  displayName: 'Package for GitHub (cmake) and Nuget'
  dependsOn: BuildTest
  jobs:
  - job: packit
    displayName: PackageIt
    workspace:
      clean: all

    strategy:
      matrix:
        Windows:
          osName: Windows_NT
          poolName: Default
          poolImageName:
          cmake.preset: Windows-Release
        Linux:
          osName: Linux
          poolName: Default
          poolImageName:
          cmake.preset: Linux-Release

    pool:
      name: $(poolName)
      vmImage: $(poolImageName)
      demands:
        - Agent.OS -equals $(osName)

    steps:
    - task: NuGetToolInstaller@1
      displayName: 'Install Nuget'
      inputs:
        versionSpec: '>=6.0.0-0'
        checkLatest: true

    # Set the flags for testing, build here.
    # sip2json_BUILD_TESTS=ON
    # sip2json_BUILD_PACKAGE=ON
    - task: CMake@1
      displayName: 'CMake Configure $(cmake.preset)'
      inputs:
        cmakeArgs: '--preset $(cmake.preset) -Dsip2json_BUILD_TESTS=ON -Dsip2json_BUILD_PACKAGE=ON -DCI_BUILDID=$(build.buildNumber)'
        workingDirectory: '$(System.DefaultWorkingDirectory)'

    # Powershell is not supported on Pi aarch64 yet so we have to use this method for Linux
    #- task: CmdLine@2
    #  displayName: 'Clean up folders on Linux machines'
    #  inputs:
    #    script: |
    #      echo "Removing the folders before we pack stuff.."
    #      rm -rdf $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests
    #      rm -rdf $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/_deps
    #      rm -rdf $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/Testing
    #      rm -rdf $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/lib
    #      rm -rdf $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/bin
    #  condition: and(succeeded(), or(startsWith(variables['Agent.OS'], 'Darwin'), startsWith(variables['Agent.OS'], 'Linux')) )

    - task: CMake@1
      displayName: 'CPack $(cmake.preset)'
      inputs:
        cmakeArgs: '-E chdir $(System.DefaultWorkingDirectory)/build/$(cmake.preset) cpack -C $(buildConfiguration) -G ZIP'
      continueOnError: false
      condition: and(succeeded(), or(startsWith(variables['Agent.OS'], 'Darwin'), startsWith(variables['Agent.OS'], 'Linux')) )

    - task: ArchiveFiles@2
      displayName: 'Adding include/ to sip2json-src-$(build.buildNumber).zip'
      inputs:
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/sip2json-src-$(build.buildNumber).zip'
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/include/'
        replaceExistingArchive: false
        verbose: true
      condition: and(succeeded(), or(startsWith(variables['Agent.OS'], 'Darwin'), startsWith(variables['Agent.OS'], 'Linux')) )

    - task: ArchiveFiles@2
      displayName: 'Adding CMakeLists.txt to sip2json-src-$(build.buildNumber).zip'
      inputs:
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/sip2json-src-$(build.buildNumber).zip'
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/CMakeLists.txt'
        replaceExistingArchive: false
        verbose: true
      condition: and(succeeded(), or(startsWith(variables['Agent.OS'], 'Darwin'), startsWith(variables['Agent.OS'], 'Linux')) )

    - task: CopyFiles@2
      displayName: 'Copy CPack Files to: $(Build.ArtifactStagingDirectory)'
      inputs:
        SourceFolder: $(System.DefaultWorkingDirectory)/build/$(cmake.preset)
        Contents: '*.zip'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      condition: and(succeeded(), or(startsWith(variables['Agent.OS'], 'Darwin'), startsWith(variables['Agent.OS'], 'Linux')) )

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact: drop'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        publishLocation: 'Container'
      condition: and(succeeded(), or(startsWith(variables['Agent.OS'], 'Darwin'), startsWith(variables['Agent.OS'], 'Linux')) )

    - task: NuGetCommand@2
      displayName: 'NuGet pack'
      inputs:
        command: 'pack'
        packagesToPack: 'pack/*.nuspec'
        versioningScheme: 'off'
        buildProperties: 'VERSION=$(build.buildNumber)'
      condition: and(succeeded(), startsWith(variables['Agent.OS'], 'Windows'))

    - task: NuGetCommand@2
      displayName: 'NuGet push'
      inputs:
        command: 'push'
        packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;build/*.nupkg'
        nuGetFeedType: 'external'
        publishFeedCredentials: 'sqs-nuget'
      condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), startsWith(variables['Agent.OS'], 'Windows'))

    - task: GitHubRelease@1
      displayName: 'Release to GitHub'
      inputs:
        gitHubConnection: 'github-packages-sqs'
        repositoryName: 'siddiqsoftware/sip2json'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(build.buildNumber)'
        title: 'v$(build.buildNumber)'
        releaseNotesSource: 'inline'
        releaseNotesInline: 'Documentation https://siddiqsoftware.github.io/sip2json'
        isPreRelease: true
        changeLogCompareToRelease: 'lastFullRelease'
        changeLogType: 'commitBased'
        addChangeLog: false
        assetUploadMode: 'replace'
      condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), startsWith(variables['Agent.OS'], 'Linux'))
