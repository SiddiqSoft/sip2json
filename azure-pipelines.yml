trigger:
  batch: true
  branches:
    include:
    - master
    - main
    - bufix/*
    - feature/*
  paths:
    exclude:
    - README.md

pool:
  name: Default
  #vmImage: Windows-2022
  demands:
  - msbuild
  - visualstudio
  - vstest

variables:
  buildPlatform: 'x64'
  
steps:
- task: UseDotNet@2
  inputs:
    version: '8.x'

- task: NuGetToolInstaller@1
  displayName: 'Use NuGet latest'
  inputs:
    versionSpec: '6.*'

- task: gitversion/setup@3.0.0
  displayName: 'Install GitVersion'

- task: gitversion/execute@3.0.0
  displayName: 'Determine version'

- script: echo %Action%%BuildVersion%
  displayName: 'Set build version'
  env:
    Action: '##vso[build.updatebuildnumber]'
    BuildVersion: $(GitVersion.MajorMinorPatch).$(GitVersion.CommitsSinceVersionSource)

- task: NuGetCommand@2
  displayName: 'NuGet restore'
  inputs:
    vstsFeed: 'a0302836-2c67-4470-bcb5-10149e5447f9'
  continueOnError: true

- task: VSBuild@1
  displayName: 'Build solution DEBUG'
  inputs:
    solution: '**/*.sln'
    vsVersion: 17.0
    platform: x64
    msbuildArgs: ''
    configuration: Debug
    maximumCpuCount: true
    msbuildArchitecture: x64

- task: VSBuild@1
  displayName: 'Build solution Release'
  inputs:
    solution: '**/*.sln'
    vsVersion: 17.0
    platform: x64
    msbuildArgs: ''
    configuration: Release
    maximumCpuCount: true
    msbuildArchitecture: x64
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

- task: VSTest@3
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyVer2: '$(System.DefaultWorkingDirectory)\test\validation_tests\Release\validation_tests.exe --gtest_output=xml:$(System.DefaultWorkingDirectory)\TestResults'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    resultsFolder: '$(System.DefaultWorkingDirectory)\TestResults'
    runInParallel: true
    codeCoverageEnabled: true
    platform: 'x64'
    configuration: 'Release'


- task: CmdLine@2
  inputs:
    script: |
      echo Running googltest
      cd test
      cd validation_tests
      cd Release
      validation_tests.exe --gtest_output=xml:..\..\..\TestResults\

- task: PublishTestResults@2
  displayName: 'Publish Release Test Results **/TEST-*.xml'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/validation_tests.xml'
    mergeTestResults: true
    buildPlatform: 'x64'
    buildConfiguration: 'release'
  continueOnError: true

- task: NuGetCommand@2
  displayName: 'NuGet pack'
  inputs:
    command: 'pack'
    packagesToPack: 'nuget/*.nuspec'
    versioningScheme: 'off'
    buildProperties: 'VERSION=$(build.buildNumber)'

- task: NuGetCommand@2
  displayName: 'NuGet push'
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg;build/*.nupkg;!build/*symbols.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'sqs-nuget'

- task: GitHubRelease@1
  inputs:
    gitHubConnection: 'github-packages-sqs'
    repositoryName: 'siddiqsoftware/sip2json'
    action: 'create'
    target: '$(Build.SourceVersion)'
    tagSource: 'userSpecifiedTag'
    tag: '$(build.buildNumber)'
    title: 'v$(build.buildNumber)'
    releaseNotesSource: 'inline'
    releaseNotesInline: 'Documentation https://siddiqsoftware.github.io/sip2json'
    isPreRelease: true
    changeLogCompareToRelease: 'lastFullRelease'
    changeLogType: 'commitBased'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
