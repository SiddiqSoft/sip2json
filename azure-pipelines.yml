trigger:
  batch: true
  branches:
    include:
    - master
    - main
    - bufix/*
    - release/*
    - hotfix/*
    - feature/*
  paths:
    exclude:
    - README.md

# This cannot be built (so long as we're using private repo) on the Azure build machines.
pool:
  name: Default
  #vmImage: Windows-2022
  demands:
  - msbuild
  - visualstudio
  - vstest

variables:
  buildPlatform: 'x64'
  
steps:
- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 6.0.0'
  inputs:
    versionSpec: '6.0.0'

- task: GitVersion@5
  inputs:
    runtime: 'core'
    preferBundledVersion: false
    # configFilePath: 'GitVersion.yml'

- script: echo %Action%%BuildVersion%
  displayName: 'Set build version'
  env:
    Action: '##vso[build.updatebuildnumber]'
    BuildVersion: $(GitVersion.MajorMinorPatch)

- task: NuGetCommand@2
  displayName: 'NuGet restore'
  inputs:
    command: 'restore'
    restoreSolution: '**/*.sln'
    feedsToUse: 'select'
    vstsFeed: 'ec2759e0-0587-4306-8a8d-8695f15e2336'
    noCache: true
  continueOnError: true

