trigger:
  batch: true
  branches:
    include:
    - master
    - bufix/*
    - feature/*
    - hotfix/*
    - release/*
  paths:
    exclude:
    - README.md

pool:
  name: Azure Pipelines
  vmImage: 'windows-2019'
  demands:
  - msbuild
  - visualstudio
  - vstest

variables:
  buildPlatform: 'x64'
  
steps:
- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 5.4.0'
  inputs:
    versionSpec: '5.4.0'
    checkLatest: true

- task: gittools.gitversion.gitversion-task.GitVersion@5
  displayName: GitVersion

- script: echo %Action%%BuildVersion%
  displayName: 'Set build version'
  env:
    Action: '##vso[build.updatebuildnumber]'
    BuildVersion: $(GitVersion.NugetVersionV2)

- task: NuGetCommand@2
  displayName: 'NuGet restore'
  inputs:
    vstsFeed: 'a0302836-2c67-4470-bcb5-10149e5447f9'
  continueOnError: true

- task: VSBuild@1
  displayName: 'Build solution sip2json.sln RELEASE'
  inputs:
    solution: 'sip2json.sln'
    platform: 'x64'
    configuration: 'release'
    maximumCpuCount: true
    msbuildArchitecture: 'x64'

- task: VSTest@2
  displayName: 'VsTest - Release'
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyVer2: |
      **\*test*.exe
      **\*test*.dll
      !**\*TestAdapter.dll
      !**\obj\**
      !**\Debug\**
    searchFolder: '$(System.DefaultWorkingDirectory)'
    resultsFolder: '$(System.DefaultWorkingDirectory)\TestResults'
    runSettingsFile: '.runsettings'
    runInParallel: true
    runTestsInIsolation: true
    codeCoverageEnabled: true
    platform: 'x64'
    configuration: 'release'
    diagnosticsEnabled: true
    rerunFailedTests: true
  continueOnError: true

- task: CmdLine@2
  inputs:
    script: |
      echo Write your commands here
      where CodeCoverage.exe
      echo "Location of dynamic code coverage tools..?"
      dir "%VCINSTALLDIR%..\Team Tools\Dynamic Code Coverage Tools"
      echo "Location of the output.."
      dir $(System.DefaultWorkingDirectory)\TestResults
      echo "Run the coverage conversion.."
      echo "%VCINSTALLDIR%..\Team Tools\Dynamic Code Coverage Tools\CodeCoverage.exe"
      dir "%VCINSTALLDIR%"
      dir "%VCINSTALLDIR%..\Team Tools"
      dir "%VCINSTALLDIR%..\Team Tools\Dynamic Code Coverage Tools"
      rem analyze /output:$(System.DefaultWorkingDirectory)\TestResults\coverage.xml

- task: reportgenerator@4
  inputs:
    reports: 'coverage.xml;**\*coverage*'
    targetdir: '$(System.DefaultWorkingDirectory)\TestResults'
    sourcedirs: '$(System.DefaultWorkingDirectory)\TestResults'

- task: PublishTestResults@2
  displayName: 'Publish Release Test Results **/TEST-*.xml'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/TEST-*.xml'
    buildPlatform: 'x64'
    buildConfiguration: 'release'
  continueOnError: true

- task: NuGetCommand@2
  displayName: 'NuGet pack'
  inputs:
    command: pack
    packagesToPack: 'build/sip2json.nuspec;!build/sip2json.symbols.nuspec'
    buildProperties: 'VERSION=$(build.buildNumber)'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

- task: NuGetCommand@2
  displayName: 'NuGet push'
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg;build/*.nupkg;!build/*symbols.nupkg'
    publishVstsFeed: 'a0302836-2c67-4470-bcb5-10149e5447f9'
    allowPackageConflicts: true
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
