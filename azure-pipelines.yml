# ============================================================================
# Azure Pipelines Main Configuration
# ============================================================================
#
# This pipeline:
# 1. Builds the library across multiple platforms with a build matrix
#    - Windows (x64, arm64) with MSVC
#    - Linux (x64) with Clang and GCC
#    - Darwin (macOS) with Clang
# 2. Runs tests on all platforms (configurable)
# 3. Publishes to NuGet, GitHub Releases, and GitHub Pages (on main/master branches)
#
# Pipeline Stages:
# 1. Windows - Cleanup, build, and test for Windows with matrix for architecture and compiler
# 2. Linux - Cleanup, build, and test for Linux with matrix for architecture and compiler
# 3. Darwin - Cleanup, build, and test for macOS with matrix for architecture and compiler
# 3. PublishNuGet - Publishes NuGet package
# 4. PublishGitHub - Creates GitHub release with build artifacts
# 5. PublishDocs - Builds MkDocs site and publishes to GitHub Pages (gh-pages) - Linux or macOS
# ============================================================================

# ============================================================================
# TRIGGER & PR CONFIGURATION
# ============================================================================
trigger:
  branches:
    include:
      - main
      - master
      - development
      - devel
      - release/*
  paths:
    exclude:
      - README.md
      - docs/*
pr:
  branches:
    include:
      - main
      - release/*

# ============================================================================
# RESOURCES
# ============================================================================
resources:
  repositories:
    - repository: self
      type: git

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: Architectures
    type: stringList
    default: [ arm64 ]
    values: [ arm64, x64 ]
    displayName: "Architectures to build (x64, arm64)"
  
  - name: Platforms
    type: stringList
    default: [ Windows, Linux, Darwin ]
    values: [ Windows, Linux, Darwin ]
    displayName: "Platforms to build (Windows, Linux, Darwin)"
  
  # Compiler Selection per Platform
  - name: Compilers_Windows
    type: stringList
    default: [ MSVC ]
    values: [ MSVC ]
    displayName: "Windows compilers to build (MSVC)"

  - name: Compilers_Linux
    type: stringList
    default: [ GCC ]
    values: [ GCC, Clang ]
    displayName: "Linux compilers to build (GCC, Clang)"

  - name: Compilers_Darwin
    type: stringList
    default: [ Clang ]
    values: [ Clang ]
    displayName: "Darwin compilers to build (Clang)"

  - name: BuildTypes
    type: stringList
    default: [ Release ]
    values: [ Release, Debug ]
    displayName: "Build types to build (Release, Debug)"
  
  # Testing & Benchmarking
  - name: RunTests
    type: boolean
    default: true
    displayName: "Run unit tests after building"

  - name: RunBenchmarks
    type: boolean
    default: true
    displayName: "Run benchmarks after building"

  # Publishing
  - name: PublishNuGet
    type: boolean
    default: false
    displayName: "Publish to NuGet (auto-enabled on main/master)"

  - name: PublishGitHub
    type: boolean
    default: false
    displayName: "Create GitHub release (auto-enabled on main/master)"

  - name: PublishDocs
    type: boolean
    default: false
    displayName: "Publish documentation site (auto-enabled on main/master)"

  - name: DocAgentOS
    type: string
    default: Linux
    values: [ Linux, Darwin ]
    displayName: "Agent OS for documentation site publication (Linux or Darwin)"

  # Cleanup
  - name: Cleanup
    type: boolean
    default: false
    displayName: "Cleanup only (skip builds and tests)"

# ============================================================================
# VARIABLES
# ============================================================================
variables:
  PublishNuGet: ${{ parameters.PublishNuGet }}
  PublishGitHub: ${{ parameters.PublishGitHub }}
  PublishDocs: ${{ parameters.PublishDocs }}

  # System information
  AgentOS: $(Agent.OS)
  AgentArch: $(Agent.OSArchitecture)

  # Build paths
  cpmCachePath: $(Agent.HomeDirectory)/.cpmcache
  buildOutputPat_h: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)
  testResultsPat_h: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests/results

# ============================================================================
# STAGES
# ============================================================================
stages:
  # ==========================================================================
  # STAGE 1: WINDOWS BUILD
  # ==========================================================================
  - stage: Windows
    displayName: Windows
    condition: ${{ containsValue(parameters.Platforms, 'Windows') }}
    dependsOn: []

    jobs:
    - ${{ if eq(parameters.Cleanup, true) }}:
      - template: .azure/az-cleanup-windows.yml
        parameters:
          displayName: "Windows Cleanup"
          BuildOperatingSystem: $(Agent.OS)
          CleanupDirectory: ${{ variables.cpmCachePath }}

    - template: .azure/az-build-windows.yml
      parameters:
        displayName: "Windows Build and Test"
        architectures: ${{ parameters.Architectures }}
        compilers: ${{ parameters.Compilers_Windows }}
        buildTypes: ${{ parameters.BuildTypes }}
        runTests: ${{ parameters.RunTests }}
        runBenchmarks: ${{ parameters.RunBenchmarks }}
        publishNuGet: ${{ variables.PublishNuGet }}

  # ==========================================================================
  # STAGE 2: LINUX BUILD
  # Runs in parallel with Windows and Darwin on independent runner machines
  # ==========================================================================
  - stage: Linux
    displayName: Linux
    dependsOn: []
    condition: ${{ containsValue(parameters.Platforms, 'Linux') }}

    jobs:
    - ${{ if eq(parameters.Cleanup, true) }}:
      - template: .azure/az-cleanup-linux.yml
        parameters:
          displayName: "Linux Cleanup"
          BuildOperatingSystem: $(Agent.OS)
          CleanupDirectory: ${{ variables.cpmCachePath }}

    - template: .azure/az-build-unix.yml
      parameters:
        displayName: "Linux Build and Test"
        architectures: ${{ parameters.Architectures }}
        compilers: ${{ parameters.Compilers_Linux }}
        buildTypes: ${{ parameters.BuildTypes }}
        runTests: ${{ parameters.RunTests }}
        runBenchmarks: ${{ parameters.RunBenchmarks }}

  # ==========================================================================
  # STAGE 3: DARWIN BUILD
  # Runs in parallel with Windows and Linux on independent runner machines
  # ==========================================================================
  - stage: Darwin
    displayName: Darwin
    dependsOn: []
    condition: ${{ containsValue(parameters.Platforms, 'Darwin') }}

    jobs:
    - ${{ if eq(parameters.Cleanup, true) }}:
      - template: .azure/az-cleanup-linux.yml
        parameters:
          displayName: "Darwin Cleanup"
          BuildOperatingSystem: $(Agent.OS)
          CleanupDirectory: ${{ variables.cpmCachePath }}

    - template: .azure/az-build-unix.yml
      parameters:
        displayName: "Darwin Build and Test"
        platform: Darwin
        agentOS: Darwin
        cmakePresetPrefix: Apple-
        architectures: ${{ parameters.Architectures }}
        compilers: ${{ parameters.Compilers_Darwin }}
        buildTypes: ${{ parameters.BuildTypes }}
        runTests: ${{ parameters.RunTests }}
        runBenchmarks: ${{ parameters.RunBenchmarks }}

  # ==========================================================================
  # STAGE 4: GITHUB RELEASE PUBLICATION
  # ==========================================================================
  - stage: PublishGitHub
    displayName: "GitHub Release"
    dependsOn:
      - Windows
      - Linux
      - Darwin
    condition: and(not(failed()), not(canceled()), or(eq('${{ parameters.PublishGitHub }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
    jobs:
      - job: ApproveGitHubRelease
        displayName: "Manual Approval - GitHub Release"
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              instructions: 'Please review and approve the creation of the GitHub Release.'
              onTimeout: 'reject'

      - template: .azure/az-publish-github.yml
        parameters:
          displayName: GitHub Release
          PublishGitHub: true
          dependsOn: [ ApproveGitHubRelease ]

  # ==========================================================================
  # STAGE 5: NUGET PUBLICATION (Gated behind GitHub Release manual approval)
  # ==========================================================================
  - stage: PublishNuGet
    displayName: "NuGet Release"
    dependsOn:
      - PublishGitHub
    condition: and(succeeded(), or(eq('${{ parameters.PublishNuGet }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
    jobs:
      - template: .azure/az-publish-nuget.yml
        parameters:
          displayName: NuGet Release
          PublishNuGet: true

  # ==========================================================================
  # STAGE 6: GITHUB PAGES DOCUMENTATION PUBLICATION
  # ==========================================================================
  - stage: PublishDocs
    displayName: "Publish Documentation Site"
    dependsOn:
      - Windows
      - Linux
      - Darwin
    condition: and(not(failed()), not(canceled()), or(eq('${{ parameters.PublishDocs }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), or(containsValue(parameters.Platforms, 'Linux'), containsValue(parameters.Platforms, 'Darwin')))
    jobs:
      - job: ApproveDocsRelease
        displayName: "Manual Approval - Documentation Site"
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              instructions: 'Please review and approve publishing the documentation site to GitHub Pages.'
              onTimeout: 'reject'

      - template: .azure/az-publish-docs.yml
        parameters:
          displayName: Publish Documentation Site
          ${{ if and(not(containsValue(parameters.Platforms, 'Linux')), containsValue(parameters.Platforms, 'Darwin')) }}:
            agentOS: Darwin
          ${{ else }}:
            agentOS: ${{ parameters.DocAgentOS }}
          dependsOn: [ ApproveDocsRelease ]
