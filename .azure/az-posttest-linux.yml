# ============================================================================
# Azure Pipelines Linux Post-Test Template
# ============================================================================
# This file contains project-specific post-test steps for Linux builds,
# including benchmark report generation and cleanup.
# ============================================================================

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: architecture
    type: string

  - name: runTests
    type: boolean
    default: true

  - name: runBenchmarks
    type: boolean
    default: true

steps:
  - bash: |
      if [ -f "$(System.DefaultWorkingDirectory)/scripts/publish_benchmarks.py" ]; then
        echo "Executing benchmark publication script in post-test phase..."
        python3 $(System.DefaultWorkingDirectory)/scripts/publish_benchmarks.py --root $(System.DefaultWorkingDirectory) --skip-build || true
      fi
    displayName: "Run Benchmark Publication Post-Test Step"
    condition: and(succeeded(), eq(${{ parameters.runBenchmarks }}, true))
    continueOnError: true
