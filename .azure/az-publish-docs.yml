# ============================================================================
# Azure Pipelines MkDocs GitHub Pages Publication Template
# ============================================================================
#
# Purpose: Build MkDocs documentation and publish to gh-pages branch
# Called by: azure-pipelines.yml (PublishDocs stage)
#
# Platform Support: Linux and macOS (Darwin) build agents.
# Automatically skips if mkdocs is not installed.
#
# This template:
# 1. Targets a Linux or macOS build agent
# 2. Sets up Python 3 virtual environment and verifies MkDocs installation
# 3. Skips gracefully if mkdocs is not installed
# 4. Ensures Doxygen is installed for C++ API reference generation
# 5. Downloads benchmark artifacts from matrix jobs and updates docs
# 6. Builds MkDocs documentation site with --strict flag
# 7. Publishes built site to gh-pages branch via ghp-import
#
# ============================================================================

parameters:
  - name: displayName
    type: string
    default: "Publish Documentation Site"

  - name: PublishDocs
    type: boolean
    default: true

  - name: agentOS
    type: string
    default: "Linux"
    values: [ "Linux", "Darwin" ]

  - name: dependsOn
    type: object
    default: []

jobs:
  - job: PublishMkDocs
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}

    pool:
      name: Default
      demands:
        - Agent.OS -equals ${{ parameters.agentOS }}

    variables:
      GH_PAGES_BRANCH: gh-pages
      SITE_DIR: $(System.DefaultWorkingDirectory)/site

    steps:
      - checkout: self
        displayName: Checkout source code
        fetchDepth: 0

      - task: CmdLine@2
        displayName: "Verify Platform (Linux/macOS) & Check MkDocs"
        name: check_mkdocs
        inputs:
          script: |
            PLATFORM="$(uname -s)"
            echo "Current platform: $PLATFORM ($(uname -m))"
            if [ "$PLATFORM" != "Linux" ] && [ "$PLATFORM" != "Darwin" ]; then
              echo "##[error]Documentation site publication cannot run under Windows. Supported platforms: Linux, macOS (Darwin). Detected: $PLATFORM."
              exit 1
            fi

            # Set up Python virtual environment and attempt dependency installation
            python3 -m venv venv || true
            if [ -f "venv/bin/activate" ]; then
              source venv/bin/activate
            fi
            python3 -m pip install --upgrade pip || true
            pip install -r docs/requirements.txt ghp-import || true

            # Ensure doxygen is installed if package manager is available
            if ! command -v doxygen &> /dev/null; then
              echo "Doxygen not found in PATH. Checking package manager..."
              if [ "$PLATFORM" = "Linux" ] && command -v apt-get &> /dev/null; then
                sudo apt-get update -y && sudo apt-get install -y doxygen || true
              elif [ "$PLATFORM" = "Darwin" ] && command -v brew &> /dev/null; then
                brew install doxygen || true
              fi
            fi

            # Check if mkdocs is executable in venv or system PATH
            MKDOCS_BIN=""
            if command -v mkdocs &> /dev/null; then
              MKDOCS_BIN="$(command -v mkdocs)"
            elif [ -x "$(pwd)/venv/bin/mkdocs" ]; then
              MKDOCS_BIN="$(pwd)/venv/bin/mkdocs"
            fi

            if [ -z "$MKDOCS_BIN" ]; then
              echo "##[warning]mkdocs is not installed; skipping documentation site build and publication."
              echo "##vso[task.setvariable variable=SkipMkDocs;isOutput=true]true"
              exit 0
            fi

            echo "[OK] MkDocs is installed: $($MKDOCS_BIN --version)"
            echo "##vso[task.setvariable variable=SkipMkDocs;isOutput=true]false"

      - task: gitversion-setup@4
        displayName: Install GitVersion
        inputs:
          versionSpec: 6.x
          preferLatestVersion: true
        condition: and(succeeded(), ne(variables['check_mkdocs.SkipMkDocs'], 'true'))

      - task: gitversion-execute@4
        displayName: Determine Version
        name: version_step
        inputs:
          useConfigFile: true
          configFilePath: GitVersion.yml
          updateBuildNumber: true
        condition: and(succeeded(), ne(variables['check_mkdocs.SkipMkDocs'], 'true'))

      - task: DownloadBuildArtifacts@0
        displayName: "Download Build Benchmark Artifacts from CI Matrix Jobs"
        inputs:
          buildType: 'current'
          downloadType: 'specific'
          itemPattern: |
            benchmark-results-*/**
            **/*benchmark*/**
            **/host_info.json
            **/stream_benchmark_results.json
            **/stream_benchmark_summary.txt
            **/benchmark_results_*.json
          downloadPath: '$(System.DefaultWorkingDirectory)/benchmarks/artifacts'
        continueOnError: true
        condition: and(succeeded(), ne(variables['check_mkdocs.SkipMkDocs'], 'true'))

      - task: CmdLine@2
        displayName: "Inspect Downloaded Benchmark Artifacts"
        inputs:
          script: |
            echo "=== Downloaded benchmark artifacts under $(System.DefaultWorkingDirectory)/benchmarks/artifacts ==="
            find $(System.DefaultWorkingDirectory)/benchmarks/artifacts -type f -exec ls -la {} + 2>/dev/null || ls -laR $(System.DefaultWorkingDirectory)/benchmarks/artifacts || true
            echo "=== End of benchmark artifacts list ==="
        condition: and(succeeded(), ne(variables['check_mkdocs.SkipMkDocs'], 'true'))

      - task: CmdLine@2
        displayName: "Compile Multi-Platform Benchmarks and Update Documentation"
        inputs:
          script: |
            cd $(System.DefaultWorkingDirectory)
            if [ -f "venv/bin/activate" ]; then
              source venv/bin/activate
            fi
            python3 scripts/publish_benchmarks.py --root $(System.DefaultWorkingDirectory)
            echo "[OK] Multi-platform benchmarks compiled and docs updated"
        condition: and(succeeded(), ne(variables['check_mkdocs.SkipMkDocs'], 'true'))

      - task: CmdLine@2
        displayName: "Build MkDocs site"
        inputs:
          script: |
            cd $(System.DefaultWorkingDirectory)
            MKDOCS_BIN="mkdocs"
            if ! command -v mkdocs &> /dev/null && [ -x "venv/bin/mkdocs" ]; then
              source venv/bin/activate
              MKDOCS_BIN="mkdocs"
            fi
            if ! command -v "$MKDOCS_BIN" &> /dev/null; then
              echo "mkdocs is not installed; skipping MkDocs build."
              exit 0
            fi
            $MKDOCS_BIN build --strict --config-file mkdocs.yml
            echo "[OK] MkDocs build completed successfully"
            ls -lFa $(System.DefaultWorkingDirectory)/site
        condition: and(succeeded(), ne(variables['check_mkdocs.SkipMkDocs'], 'true'))

      - task: CmdLine@2
        displayName: "Configure Git & Deploy to gh-pages via ghp-import"
        inputs:
          script: |
            set -e
            if ! command -v ghp-import &> /dev/null && [ -f "venv/bin/activate" ]; then
              source venv/bin/activate
            fi
            if ! command -v ghp-import &> /dev/null; then
              echo "ghp-import is not installed; skipping deployment."
              exit 0
            fi
            if [ ! -d "$(System.DefaultWorkingDirectory)/site" ]; then
              echo "Site directory does not exist; skipping deployment."
              exit 0
            fi

            git config --global user.email "$(GITHUB_USER)"
            git config --global user.name "Azure Pipelines Bot"

            # Configure authentication token if provided
            if [ -n "$(GITHUB_TOKEN)" ]; then
              git config --global url."https://$(GITHUB_TOKEN)@github.com/".insteadOf "https://github.com/"
            fi

            echo "Deploying site to branch $(GH_PAGES_BRANCH)..."
            ghp-import -n -p -f $(System.DefaultWorkingDirectory)/site -b $(GH_PAGES_BRANCH) -m "Deploy documentation from Azure Pipelines build $(Build.BuildNumber) [skip ci]"

            echo "[OK] Successfully deployed MkDocs documentation to $(GH_PAGES_BRANCH)"
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
        condition: and(succeeded(), eq(${{ parameters.PublishDocs }}, true), ne(variables['check_mkdocs.SkipMkDocs'], 'true'))
