# ============================================================================
# Azure Pipelines Windows Pre-Build Setup Template
# ============================================================================
# Purpose: Project-specific environment preparation for Windows builds.
# Called by: az-build-windows.yml
# ============================================================================

parameters:
  - name: architecture
    type: string

  - name: runTests
    type: boolean
    
steps:
  # ====================================================================
  # Environment Setup for CTRE & Windows Long Paths
  # ====================================================================
  - powershell: |
      Write-Host "Preparing Windows build machine for CTRE & sip2json..."
      
      # 1. Enable Registry LongPathsEnabled = 1
      try {
        $regPath = "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem"
        Set-ItemProperty -Path $regPath -Name "LongPathsEnabled" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Write-Host "[OK] LongPathsEnabled set to 1 in Registry."
      } catch {
        Write-Host "Note: Registry LongPathsEnabled update skipped or requires Admin rights."
      }

      # 2. Configure Git Global Core Long Paths
      try {
        git config --global core.longpaths true
        Write-Host "[OK] Configured git config --global core.longpaths true."
      } catch {
        Write-Host "Note: git core.longpaths configuration skipped."
      }

      # 3. Execute prep_windows_machine.ps1 if available
      $prepScript = "$(System.DefaultWorkingDirectory)/scripts/prep_windows_machine.ps1"
      if (Test-Path $prepScript) {
        Write-Host "Executing prep_windows_machine.ps1 script..."
        & powershell -ExecutionPolicy Bypass -File $prepScript -ErrorAction SilentlyContinue
      }
    displayName: Prepare Windows Environment for CTRE
    workingDirectory: $(System.DefaultWorkingDirectory)
    continueOnError: true
