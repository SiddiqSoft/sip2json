# ============================================================================
# Azure Pipelines Windows Build Template
# ============================================================================
#
# Purpose: Build the project on Windows with MSVC compiler
# Called by: azure-pipelines.yml (StgBldWindows stage)
# Triggers: When RunWindows parameter is true
#
# This template:
# 1. Builds the project on Windows with MSVC compiler
# 2. Supports x64 and arm64 architectures
# 3. Runs tests (optional)
# 4. Creates NuGet packages
# 5. Publishes build artifacts

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: displayName
    type: string

  - name: architectures
    type: stringList
    default: [ x64, arm64 ]
    values: [ x64, arm64 ]

  - name: compilers
    type: stringList
    default: [ MSVC ]
    values: [ MSVC ]

  - name: buildTypes
    type: stringList
    default: [ Release, Debug ]
    values: [ Release, Debug ]

  - name: runTests
    type: boolean
    default: true

  - name: runBenchmarks
    type: boolean
    default: true

  - name: publishNuGet
    type: boolean
    default: false


# ============================================================================
# JOBS
# ============================================================================
jobs:
  - ${{ each arch in parameters.architectures }}:
    - ${{ each compiler in parameters.compilers }}:
        - ${{ each buildType in parameters.buildTypes }}:
          - job: Job_Windows_${{ arch }}_${{ compiler }}_${{ buildType }}
            displayName: "Build Windows ${{ arch }} with ${{ compiler }} (${{ buildType }})"
            
            #condition: eq('${{ arch }}', $(Agent.OSArchitecture))
            
            workspace:
              clean: all
            
            pool:
              name: Default
              ${{ if or(eq(arch, 'x64'), eq(arch, 'X64')) }}:
                demands:
                  - Agent.OS -equals Windows_NT
                  - Agent.OSArchitecture -equals X64
              ${{ else }}:
                demands:
                  - Agent.OS -equals Windows_NT

            variables:
              cmakePreset: Windows-${{ arch }}-${{ buildType }}
              buildType: ${{ buildType }}

            steps:
              # ====================================================================
              # Checkout & Cleanup
              # ====================================================================
              - checkout: self
                name: step1

              # ====================================================================
              # Environment Setup
              # ====================================================================
              - task: BatchScript@1
                displayName: Detect Visual Studio paths
                inputs:
                  filename: $(System.DefaultWorkingDirectory)/.azure/pipeline_detect_vs_path.bat
                  modifyEnvironment: true

              - powershell: |
                  $hostArch = "$env:AGENT_OSARCHITECTURE".ToLower()
                  if ($hostArch -eq "amd64") { $hostArch = "x64" }
                  $targetArch = "${{ arch }}".ToLower()

                  if ($hostArch -eq $targetArch) {
                    $vcvarsArg = $targetArch
                  } else {
                    $vcvarsArg = "${hostArch}_${targetArch}"
                  }

                  Write-Host "Configured vcvarsall argument: $vcvarsArg (Host: $hostArch, Target: $targetArch)"
                  Write-Host "##vso[task.setvariable variable=VCVARS_ARG]$vcvarsArg"
                displayName: Determine MSVC vcvarsall architecture argument
              
              - task: BatchScript@1
                displayName: Setup ${{ compiler }} environment for ${{ arch }}
                inputs:
                  filename: $(VCVARS_PATH)
                  arguments: $(VCVARS_ARG)
                  modifyEnvironment: true

              - template: az-pretest-windows.yml
                parameters:
                  architecture: ${{ arch }}
                  runTests: ${{ parameters.runTests }}
              
              # ====================================================================
              # Version Detection
              # ====================================================================
              - task: gitversion-setup@4
                displayName: Install GitVersion
                inputs:
                  versionSpec: 6.x
                  preferLatestVersion: true

              - task: gitversion-execute@4
                displayName: Determine Version
                name: version_step
                inputs:
                  useConfigFile: true
                  configFilePath: GitVersion.yml
                  updateBuildNumber: true
              
              # ====================================================================
              # Build Number
              # ====================================================================
              - task: PowerShell@2
                displayName: Set Build Number (Release)
                inputs:
                  targetType: inline
                  script: Write-Host "##vso[build.updateBuildNumber]$(GITVERSION_MAJORMINORPATCH)"
                condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

              - task: PowerShell@2
                displayName: Set Build Number (Pre-release)
                inputs:
                  targetType: inline
                  script: Write-Host "##vso[build.updateBuildNumber]$(GITVERSION_SEMVER)"
                condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))

              # ====================================================================
              # Build
              # ====================================================================
              - task: CMake@1
                displayName: CMake Configure
                inputs:
                  cmakeArgs: "--preset $(cmakePreset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH) -DCPM_SOURCE_CACHE=$(cpmCachePath) -Dsip2json_BUILD_BENCHMARKS=ON"
                  workingDirectory: $(System.DefaultWorkingDirectory)
              
              - task: CMake@1
                displayName: CMake Build
                inputs:
                  cmakeArgs: "--build --preset $(cmakePreset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH) -DCPM_SOURCE_CACHE=$(cpmCachePath)"
                  workingDirectory: $(System.DefaultWorkingDirectory)
                condition: succeeded()

              - task: PublishBuildArtifacts@1
                displayName: Publish Build Artifacts
                inputs:
                  PathtoPublish: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)
                  ArtifactName: build-$(cmakePreset)
                  publishLocation: Container
                condition: succeeded()
              
              # ====================================================================
              # Testing
              # ====================================================================
              - task: CMake@1
                displayName: CMake Tests
                inputs:
                  cmakeArgs: "-E chdir $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests ctest --output-junit $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests/results/$(cmakePreset)_test_detail.xml --output-on-failure"
                continueOnError: true
                condition: and(succeeded(), eq(${{ parameters.runTests }}, true))

              - template: az-posttest-windows.yml
                parameters:
                  runTests: ${{ parameters.runTests }}
                  architecture: ${{ arch }}
              
              - task: PublishTestResults@2
                displayName: Publish Test Results
                inputs:
                  testResultsFormat: JUnit
                  testRunTitle: Tests $(cmakePreset)
                  testResultsFiles: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests/results/$(cmakePreset)_test_detail.xml
                  mergeTestResults: false
                  buildConfiguration: $(BuildType)
                continueOnError: true
                condition: and(succeeded(), eq(${{ parameters.runTests }}, true))
              # ====================================================================
              # BENCHMARKS (Release builds on Windows)
              # ====================================================================
              - powershell: |
                  Write-Host "Running sip2json benchmarks on Windows Release build..."
                  $resultsDir = "$(System.DefaultWorkingDirectory)/build/$(cmakePreset)/benchmarks/results"
                  New-Item -ItemType Directory -Force -Path $resultsDir
                  Set-Content -Path "$resultsDir/README.txt" -Value "Benchmark Results for Windows ${{ arch }} ${{ compiler }}"

                  # 0. Capture Windows runner host environment dynamically
                  try {
                    $osInfo = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
                    $cpuInfo = Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -First 1
                    $osCaption = if ($osInfo -and $osInfo.Caption) { $osInfo.Caption.Trim() } else { "Windows" }
                    $osVer = if ($osInfo -and $osInfo.Version) { $osInfo.Version } else { [System.Environment]::OSVersion.Version.ToString() }
                    $buildNum = if ($osInfo -and $osInfo.BuildNumber) { $osInfo.BuildNumber } else { "" }
                    $cpuCores = [System.Environment]::ProcessorCount
                    $cpuModel = if ($cpuInfo -and $cpuInfo.Name) { $cpuInfo.Name.Trim() } else { "$env:PROCESSOR_ARCHITECTURE" }

                    $compilerVer = ""
                    $cmakeCachePath = "$(System.DefaultWorkingDirectory)/build/$(cmakePreset)/CMakeCache.txt"
                    if (Test-Path $cmakeCachePath) {
                      $cacheLine = Get-Content $cmakeCachePath | Where-Object { $_ -like "CMAKE_CXX_COMPILER_VERSION:STRING=*" } | Select-Object -First 1
                      if ($cacheLine) {
                        $compilerVer = ($cacheLine -split "=", 2)[1].Trim()
                      }
                    }
                    if (-not $compilerVer -and $env:VCToolsVersion) {
                      $compilerVer = $env:VCToolsVersion.Trim()
                    }
                    if (-not $compilerVer -and (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
                      $clOut = (& cl.exe 2>&1 | Out-String)
                      if ($clOut -match 'Version\s+([0-9]+(?:\.[0-9]+)+)') {
                        $compilerVer = $Matches[1]
                      }
                    }

                    $compStr = if ($compilerVer) { "${{ compiler }} $compilerVer" } else { "${{ compiler }}" }
                    $hostSummary = "$osCaption (Build $buildNum, ${{ arch }}, $cpuCores CPU Cores, $compStr)"
                    $hostData = [PSCustomObject]@{
                      platform         = "Windows"
                      arch             = "${{ arch }}"
                      compiler         = "${{ compiler }}"
                      compiler_version = $compilerVer
                      os_name          = "Windows"
                      os_release       = $osCaption
                      os_version       = $osVer
                      kernel           = $buildNum
                      cpu_cores        = $cpuCores
                      cpu_model        = $cpuModel
                      host_summary     = $hostSummary
                      agent_name       = $env:Agent_Name
                      agent_os         = $env:Agent_OS
                      build_id         = $env:Build_BuildId
                      build_number     = $env:Build_BuildNumber
                    }
                    $hostData | ConvertTo-Json -Depth 3 | Set-Content -Path "$resultsDir/host_info.json" -Encoding utf8
                    Write-Host "Captured Windows Runner Host Info: $hostSummary"
                  } catch {
                    Write-Host "##[warning]Failed to capture host info: $_"
                  }
                  
                  # 1. Run Google Benchmark suite if built
                  $googleBenchExe = "$(System.DefaultWorkingDirectory)/build/$(cmakePreset)/benchmarks/sip2json_benchmarks.exe"
                  if (-not (Test-Path $googleBenchExe)) {
                    $googleBenchExe = Get-ChildItem -Path "$(System.DefaultWorkingDirectory)/build/$(cmakePreset)" -Filter "sip2json_benchmarks.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
                  }
                  if ($googleBenchExe -and (Test-Path $googleBenchExe)) {
                    Write-Host "Executing Google Benchmark: $googleBenchExe"
                    & $googleBenchExe "--benchmark_out=$resultsDir/benchmark_results_Windows_${{ arch }}_${{ compiler }}.json" "--benchmark_out_format=json"
                    
                    $pyExe = Get-Command "py", "python3", "python" -ErrorAction SilentlyContinue | Where-Object { $_.Source -notlike "*WindowsApps*" } | Select-Object -First 1
                    if ($pyExe) {
                      Write-Host "Using Python interpreter: $($pyExe.Source)"
                      & $pyExe.Source "$(System.DefaultWorkingDirectory)/benchmarks/benchmark_report_generator.py" "$resultsDir/benchmark_results_Windows_${{ arch }}_${{ compiler }}.json" "$resultsDir"
                    } else {
                      Write-Host "##[warning]Python interpreter not found, skipping benchmark HTML/XML report generation"
                    }
                  } else {
                    Write-Host "##[warning]sip2json_benchmarks.exe not found in build tree"
                  }

                  # 2. Run custom single-threaded stream benchmark harness
                  $streamBenchExe = "$(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests/benchmark/sip2json_benchmark.exe"
                  if (-not (Test-Path $streamBenchExe)) {
                    $streamBenchExe = Get-ChildItem -Path "$(System.DefaultWorkingDirectory)/build/$(cmakePreset)" -Filter "sip2json_benchmark.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
                  }
                  if ($streamBenchExe -and (Test-Path $streamBenchExe)) {
                    Write-Host "Executing Stream Benchmark: $streamBenchExe"
                    & $streamBenchExe "$(System.DefaultWorkingDirectory)/tests/validation/samples" --output-json "$resultsDir/stream_benchmark_results.json" | Out-File -FilePath "$resultsDir/stream_benchmark_summary.txt" -Encoding utf8
                  } else {
                    Write-Host "##[warning]sip2json_benchmark.exe not found in build tree"
                  }

                  Write-Host "Directory contents of ${resultsDir}:"
                  Get-ChildItem -Path $resultsDir
                displayName: Run Benchmarks and Generate Reports
                workingDirectory: $(System.DefaultWorkingDirectory)
                condition: and(succeeded(), eq(${{ parameters.runBenchmarks }}, true), eq(variables['BuildType'], 'Release'))
                continueOnError: true

              - task: PublishBuildArtifacts@1
                displayName: Publish Benchmark Artifacts
                inputs:
                  PathtoPublish: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/benchmarks/results
                  ArtifactName: benchmark-results-Windows-${{ arch }}-${{ compiler }}
                  publishLocation: Container
                continueOnError: true
                condition: and(succeeded(), eq(${{ parameters.runBenchmarks }}, true), eq(variables['BuildType'], 'Release'))

              # ====================================================================
              # NuGet Packaging
              # ====================================================================
              - task: NuGetToolInstaller@1
                displayName: Install NuGet
                inputs:
                  versionSpec: ">=6.0.0-0"
                  checkLatest: true
                condition: and(succeeded(), eq(variables['BuildType'], 'Release'), eq('${{ arch }}', '${{ parameters.architectures[0] }}'), eq('${{ compiler }}', '${{ parameters.compilers[0] }}'), or(eq('${{ parameters.publishNuGet }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

              - task: NuGetCommand@2
                displayName: NuGet Pack
                inputs:
                  command: pack
                  packagesToPack: pack/*.nuspec
                  packDestination: $(Build.ArtifactStagingDirectory)
                  versioningScheme: off
                  buildProperties: VERSION=$(GITVERSION_MAJORMINORPATCH)
                condition: and(succeeded(), eq(variables['BuildType'], 'Release'), eq('${{ arch }}', '${{ parameters.architectures[0] }}'), eq('${{ compiler }}', '${{ parameters.compilers[0] }}'), or(eq('${{ parameters.publishNuGet }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

              - task: PublishBuildArtifacts@1
                displayName: Publish NuGet Artifacts
                inputs:
                  PathtoPublish: $(Build.ArtifactStagingDirectory)
                  ArtifactName: nuget-packages
                  publishLocation: Container
                condition: and(succeeded(), eq(variables['BuildType'], 'Release'), eq('${{ arch }}', '${{ parameters.architectures[0] }}'), eq('${{ compiler }}', '${{ parameters.compilers[0] }}'), or(eq('${{ parameters.publishNuGet }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
