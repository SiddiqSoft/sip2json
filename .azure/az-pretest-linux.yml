# ============================================================================
# Azure Pipelines Linux Build Template
# ============================================================================
# This file should contain project-specific pre-test steps for Linux builds.
# It is included in the main Linux build pipeline before running tests.
# ============================================================================

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: architecture
    type: string

  - name: runTests
    type: boolean
     
steps:
  - bash: |
      echo "Cleaning old GCDA coverage files..."
      find $(System.DefaultWorkingDirectory) -name "*.gcda" -delete 2>/dev/null || true
    displayName: Clean old GCDA coverage files
