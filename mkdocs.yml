site_name: sip2json
site_description: SIP Parser for Modern C++
site_author: Siddiq Software LLC
site_url: https://siddiqsoft.github.io/sip2json/
repo_url: https://github.com/SiddiqSoft/sip2json
repo_name: SiddiqSoft/sip2json
edit_uri: edit/main/docs/

hooks:
  - docs/hooks.py

extra:
  version: "0.0.0-dev"

theme:
  name: material
  language: en
  logo: assets/Siddiq-Software-Avatar.png
  favicon: assets/Siddiq-Software-Avatar.png
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Iosevka Alie
    code: Iosevka
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - css/custom.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - js/fontsize.js

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start & CMake: integration/cmake.md
      - Project Dependencies: integration/dependencies.md
      - Practical Examples: examples/index.md
  - API Reference:
      - sipmessage: api/sipmessage.md
      - sip2json Functions: api/sip2json.md
      - Exceptions & Error Codes: api/errors.md
  - Core Concepts & Architecture:
      - JSON Metaphor & Schema: features/json_schema.md
      - Stream Architecture & Data Flow: architecture/dataflow.md
      - Session Description Protocol (SDP): features/sdp.md
      - Standards Compliance & Torture Tests: features/compliance.md
      - IETF Test Suite Reference: features/test_suite_sources.md
  - Performance & Benchmarks:
      - Empirical Benchmarks & Metrics: features/benchmarks.md
      - Optimization Choices & Hardware Study: features/optimization_choices.md
      - Native Struct vs JSON Study: architecture/native_vs_json.md
  - Maintainer Guide:
      - Overview & Handbook: maintainers/index.md
      - Environment Setup: maintainers/setup.md
      - Building, Testing & Benchmarks: maintainers/building.md
      - Documentation & MkDocs: maintainers/documentation.md
      - Azure Pipelines & Secrets: maintainers/pipelines.md
  - License: license.md
