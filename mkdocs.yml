site_name: sip2json
site_description: SIP Parser for Modern C++
site_author: Siddiq Software LLC
site_url: https://siddiqsoft.github.io/sip2json/
repo_url: https://github.com/SiddiqSoft/sip2json
repo_name: SiddiqSoft/sip2json
edit_uri: edit/main/docs/

hooks:
  - docs/hooks.py

exclude_docs: |
  .guidelines.md
  hooks.py
  requirements.txt
  rebuild-docs.*
  Doxyfile
  doxygen_xml/*
  doxygen_xml/**
  __pycache__/*

extra:
  version: "0.0.0-dev"

theme:
  name: material
  language: en
  logo: assets/Siddiq-Software-Avatar.png
  favicon: assets/Siddiq-Software-Avatar.png
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Typography: Primary text and code font families (loaded via Google Fonts)
  # Modify these values to customize typeface across cxxtemplate projects.
  # Sizing, retina scaling, and system fallbacks are configured in docs/css/custom.css.
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    # - toc.integrate # everything in the left side nav bar, but not great for large docs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - css/custom.css


nav:
  - Home: index.md
  - Getting Started:
      - Overview: quickstart/index.md
      - Dependencies: quickstart/dependencies.md
      - CMake & CPM: quickstart/cmake.md
      - NuGet Package: quickstart/nuget.md
  - API Reference:
      - Overview: api/index.md
      - sip2json: api/sip2json.md
      - sipmessage: api/sipmessage.md
      - Constants & Header Keys: api/constants.md
      - Exceptions & Errors: api/errors.md
      - JSON Schema & Metaphor: api/json_schema.md
      - SDP Support: api/sdp.md
      - Code Examples: api/examples/index.md
  - Related Pages:
      - Benchmarks: architecture/benchmarks.md
      - Architecture: architecture/index.md
      - Stream Mechanics: architecture/async.md
      - Optimization Choices: architecture/optimization_choices.md
      - Standards Compliance: architecture/compliance.md
      - Test Suite & RFC Reference: architecture/test_suite_sources.md
      - Maintainer Guide: maintainers/pipelines.md
      - License: license.md
